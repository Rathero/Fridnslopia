<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>TRAMPA 3D</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05060c; overflow: hidden; touch-action: none; font-family: system-ui, sans-serif; }
      #app { width: 100vw; height: 100vh; }
      #hud {
        position: fixed; top: 14px; left: 16px; color: #eaf2ff; z-index: 5; pointer-events: none;
        text-shadow: 0 2px 8px rgba(0,0,0,.6);
      }
      #time { font-size: 40px; font-weight: 800; letter-spacing: 1px; }
      #sub { font-size: 14px; color: #8fd; margin-top: 2px; }
      #hint { position: fixed; top: 16px; right: 18px; color: #9fb; font-size: 12px; z-index: 5; opacity:.8; }
      .zone { position: fixed; bottom: 0; height: 40vh; width: 33vw; z-index: 4; }
      #zl { left: 0; } #zr { right: 0; } #zj { left: 33vw; width: 34vw; }
      #banner {
        position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 8;
        background: radial-gradient(circle at 50% 30%, rgba(8,16,32,.7), rgba(3,4,9,.92));
      }
      #banner .card { text-align: center; color: #eaf2ff; }
      #banner h1 { font-size: 64px; margin: 0; color: #45e0ff; }
      #banner p { font-size: 18px; color: #9fb; }
      #banner button { margin-top: 14px; padding: 14px 26px; border: none; border-radius: 12px; background: #45e0ff; color: #04121a; font-size: 18px; font-weight: 800; cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"><div id="time">0.00</div><div id="sub">TRAMPA 3D · cenital</div></div>
    <div id="hint">← → esquiva · ESPACIO salta</div>
    <div class="zone" id="zl"></div>
    <div class="zone" id="zj"></div>
    <div class="zone" id="zr"></div>
    <div id="banner"><div class="card"><h1 id="btitle">¡META!</h1><p id="bsub"></p><button id="bbtn">Otra vez</button></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
