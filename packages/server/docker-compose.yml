services:
  postgres:
    image: postgres:16
    container_name: trampa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: trampa
      POSTGRES_PASSWORD: trampa
      POSTGRES_DB: trampa
    ports:
      - "5432:5432"
    volumes:
      - trampa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trampa -d trampa"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  trampa_pgdata:
